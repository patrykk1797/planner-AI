    <script>
      // Environment constraint: HMR is disabled, ignore WebSocket errors
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event && event.reason && (event.reason.message || String(event.reason))) || '';
        var stack = (event && event.reason && event.reason.stack) || '';
        if (msg.includes('WebSocket') || msg.includes('vite') || stack.includes('@vite/client')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var filename = (event && event.filename) || '';
        if (msg.includes('WebSocket') || filename.includes('@vite/client')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
